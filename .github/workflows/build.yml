# ---------------------------------------------------------------------------
# FrostyMcpPlugin - build CI
#
# What it does
#   * Checks out this repo (the plugin) AND a FrostyToolsuite checkout, because
#     the plugin is not standalone: FrostyMcpPlugin.csproj resolves FrostySdk,
#     FrostyControls, FrostyCore and FrostyHash (C++/CLI) through
#         /p:FrostyRoot=<path to the folder that contains FrostyEditor / FrostySdk>
#     and pulls Newtonsoft.Json / SharpDX out of FrostyEditor\ThirdParty.
#   * Builds the plugin with MSBuild for x64 in the Frosty configuration names
#     ("Developer - Debug", "Release - Final").
#     Workspace layout: the plugin is checked out into ./plugin and the Toolsuite
#     into ./FrostyToolsuite, i.e. two sibling directories - the Toolsuite must
#     not sit inside the plugin's project directory (see the checkout step).
#   * Verifies the produced DLL is a .NET Framework v4.0.30319 (net48) assembly
#     and that the post-build copy into FrostyEditor\bin\...\Plugins\ happened.
#   * Uploads the DLL/PDB as artifacts; on a v* tag it packages a release asset.
#
# Windows 10 21H2 support
#   The plugin targets net48 (.NET Framework 4.8), which is the in-box .NET
#   Framework version of Windows 10 21H2 (OS build 19044, .NET Framework 528040)
#   and of every newer Windows 10 / 11 release, so a net48 + x64 plugin needs no
#   extra runtime on the user's machine.
#   The CI proves this by
#     1. requiring the runner OS to be at least 19044 (the 21H2 build number),
#     2. building with the same x64 / v143 toolchain the plugin ships with,
#     3. asserting the artifact's CLR header targets .NET Framework 4.x (not
#        .NET 5+/Core, which would NOT load inside Frosty Editor on 21H2).
#   windows-2022 (Server 2022, build 20348 + VS2022 17.14: MSBuild v143, "C++/CLI
#   support for v143", .NET Framework 4.8 targeting pack, Windows SDK 10.0.26100)
#   is the baseline; windows-2025 is built too, as a forward-compatibility canary.
#
# Which FrostyToolsuite
#   Defaults to CadeEvs/FrostyToolsuite @ 1.0.6.3; the plugin's XML bridge calls
#   match that upstream API (EbxXmlWriter(Stream, AssetManager) +
#   WriteObjects(IEnumerable<object>)).  Override permanently with the
#   repository variables FROSTY_TOOLSUITE_REPO / FROSTY_TOOLSUITE_REF, or per
#   run through the workflow_dispatch inputs frosty_repo / frosty_ref.
#
# Known code-side limitation (handled, not a workflow problem)
#   Bridge/McpHandlers.cs used to call
#       new EbxYamlWriter(ms, App.AssetManager) / writer.WriteObjects(asset.RootObjects)
#   unconditionally, but no branch of CadeEvs/FrostyToolsuite (1.0.6 ... 1.0.7)
#   contains EbxYamlWriter at all - only EbxXmlWriter.  That line now sits behind
#   FROSTY_HAS_YAML_WRITER, which FrostyMcpPlugin.csproj defines only when the
#   Toolsuite under $(FrostyRoot) really ships FrostySdk\IO\EbxYamlWriter.cs, so
#   an upstream checkout compiles and get_ebx_yaml answers YAML_NOT_SUPPORTED.
#   A fork that does have the class (HarGabt/FrostyToolsuite) uses a different
#   signature, so for that one build with /p:FrostyHasYamlWriter=false - or port
#   the call.  get_ebx_xml is unaffected.
#
# Manual run
#   Actions -> build -> Run workflow, optionally overriding the FrostyToolsuite
#   repository and ref the plugin is compiled against.
# ---------------------------------------------------------------------------
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      frosty_repo:
        description: FrostyToolsuite repository (owner/name) to build against
        required: false
        type: string
        default: CadeEvs/FrostyToolsuite
      frosty_ref:
        description: FrostyToolsuite branch/tag/commit to build against
        required: false
        type: string
        default: 1.0.6.3

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # FrostyToolsuite the plugin is compiled against.
  # Resolution order: dispatch input > repository variable > default.
  # To use another source (your own fork) permanently, set the repository
  # variables FROSTY_TOOLSUITE_REPO / FROSTY_TOOLSUITE_REF under
  # Settings -> Secrets and variables -> Actions -> Variables.
  FROSTY_TOOLSUITE_REPO: ${{ inputs.frosty_repo || vars.FROSTY_TOOLSUITE_REPO || 'CadeEvs/FrostyToolsuite' }}
  FROSTY_TOOLSUITE_REF: ${{ inputs.frosty_ref || vars.FROSTY_TOOLSUITE_REF || '1.0.6.3' }}

jobs:
  # -------------------------------------------------------------------------
  # Plugin build (the "at least Windows 10 21H2" gate lives here)
  # -------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.configuration }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # needed only for the tag-triggered release steps
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline: Windows Server 2022 runner == the oldest runner that still
          # has the VS2022 v143 toolset + C++/CLI support the Toolsuite needs.
          - os: windows-2022
            configuration: Developer - Debug
            slug: debug
            outdir: bin/Developer/Debug
            release: false
            experimental: false
          - os: windows-2022
            configuration: Release - Final
            slug: release-final
            outdir: bin/Release/Final
            release: true
            experimental: false
          # Canary: same build on the newest Windows runner. Allowed to fail so a
          # runner-image regression cannot block the baseline.
          - os: windows-2025
            configuration: Developer - Debug
            slug: debug
            outdir: bin/Developer/Debug
            release: false
            experimental: true

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          # The plugin must live in its own subdirectory, next to (not containing)
          # the Toolsuite: the SDK-style project compiles **/*.cs below its own
          # directory, so a Toolsuite checked out inside it would drag in
          # FrostySdk/FrostyControls/FrostyPlugin/Plugins sources and fail with
          # CS0579 duplicate-attribute / CS0101 duplicate-type errors.
          path: plugin
          persist-credentials: false

      - name: Checkout FrostyToolsuite (${{ env.FROSTY_TOOLSUITE_REPO }}@${{ env.FROSTY_TOOLSUITE_REF }})
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FROSTY_TOOLSUITE_REPO }}
          ref: ${{ env.FROSTY_TOOLSUITE_REF }}
          path: FrostyToolsuite
          fetch-depth: 1
          persist-credentials: false

      - name: Runner OS / Windows 10 21H2 baseline gate
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $build = [int]$os.BuildNumber
          $line = "Runner OS: $($os.Caption) $($os.Version), build $build"
          Write-Host $line
          # 19044 = Windows 10 21H2. Runners are server SKUs and are always newer,
          # but the check documents and enforces the floor we claim to support.
          if ($build -lt 19044) {
              throw "$($os.Caption) build $build is older than Windows 10 21H2 (19044); this workflow claims 21H2 support."
          }
          $toolsuite = Join-Path $env:GITHUB_WORKSPACE 'FrostyToolsuite'
          $rev = (& git -C $toolsuite rev-parse HEAD).Trim()
          $detail = @(
              $line
              "FrostyToolsuite: $rev ($env:FROSTY_TOOLSUITE_REPO@$env:FROSTY_TOOLSUITE_REF)"
              "Configuration  : ${{ matrix.configuration }} | Platform: x64"
              "Target runtime : net48 (.NET Framework 4.8, in-box since Windows 10 21H2 / build 19044)"
          )
          $detail | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.FROSTY_TOOLSUITE_REF }}-${{ hashFiles('**/*.csproj', '**/*.vcxproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.FROSTY_TOOLSUITE_REF }}-

      - name: Set up MSBuild (VS2022, v143 + C++/CLI)
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Restore NuGet packages
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'FrostyToolsuite'
          $targets = @(
              (Join-Path $root 'FrostySdk\FrostySdk.csproj')
              (Join-Path $root 'FrostyControls\FrostyControls.csproj')
              (Join-Path $root 'FrostyPlugin\FrostyCore.csproj')
              (Join-Path $env:GITHUB_WORKSPACE 'plugin/FrostyMcpPlugin.csproj')
          )
          $nuget = Get-Command nuget.exe -ErrorAction SilentlyContinue
          foreach ($project in $targets) {
              Write-Host "::group::NuGet restore $project"
              & msbuild $project -nologo -v:minimal -t:Restore
              $code = $LASTEXITCODE
              if ($code -ne 0 -and $nuget) {
                  Write-Warning "msbuild -t:Restore failed (exit $code); retrying with nuget.exe"
                  & $nuget.Source restore $project -NonInteractive
                  $code = $LASTEXITCODE
              }
              Write-Host '::endgroup::'
              if ($code -ne 0) { throw "NuGet restore failed for $project (exit $code)" }
          }

      - name: Build plugin (MSBuild, x64)
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          $ErrorActionPreference = 'Stop'
          # FrostyRoot must end with a separator: the csproj appends "FrostySdk\...".
          # Forward slashes keep the trailing separator unambiguous for argument
          # passing; MSBuild accepts them on Windows.
          $frostyRoot = (Join-Path $env:GITHUB_WORKSPACE 'FrostyToolsuite').Replace('\', '/') + '/'
          $logFile = Join-Path $env:RUNNER_TEMP 'msbuild.log'
          Write-Host "Configuration: $env:CONFIGURATION"
          Write-Host "FrostyRoot   : $frostyRoot"
          # NOTE: the .sln is intentionally NOT used here. A solution build
          # rewrites Configuration/Platform per project from the .sln's
          # configuration table, and for the referenced projects (which are not
          # part of FrostyMcpPlugin.sln) MSBuild falls back to Platform=AnyCPU.
          # The Frosty projects only define 'Developer - Debug|x64' style names,
          # so they lose their OutputPath and the build dies with
          # "The BaseOutputPath/OutputPath property is not set for project ...".
          # Building the project directly propagates the global
          # Configuration/Platform to every ProjectReference instead.
          $msbuildArgs = @(
              (Join-Path $env:GITHUB_WORKSPACE 'plugin/FrostyMcpPlugin.csproj')
              '-nologo'
              '-m'
              '-v:minimal'
              "-p:Configuration=$env:CONFIGURATION"
              '-p:Platform=x64'
              "-p:FrostyRoot=$frostyRoot"
              "-bl:$($env:GITHUB_WORKSPACE)/msbuild-${{ matrix.slug }}.binlog"
          )
          & msbuild @msbuildArgs 2>&1 | Tee-Object -FilePath $logFile
          $code = $LASTEXITCODE
          if ($code -eq 0) {
              Write-Host 'MSBuild succeeded.'
              exit 0
          }

          # --- diagnostics -----------------------------------------------------
          # Job logs of this repo are not readable without an authenticated API
          # call, so the interesting lines are republished as check-run
          # annotations (visible in the UI and through the public Checks API).
          function Write-Problem([string] $text) {
              $safe = $text.Trim() -replace '%', '%25' -replace "`r", '' -replace "`n", ' '
              if ($safe.Length -gt 900) { $safe = $safe.Substring(0, 900) + ' ...' }
              Write-Host $safe
              Write-Host "::error::$safe"
          }
          $problems = @(
              Get-Content -LiteralPath $logFile |
                  Where-Object { $_ -match 'error\s+[A-Z]+\d+' -or $_ -match 'fatal error' -or $_ -match ':\s+error\s' } |
                  Select-Object -First 25
          )
          if ($problems.Count -gt 0) {
              foreach ($line in $problems) { Write-Problem $line }
          } else {
              Write-Host 'No line matched the MSBuild error pattern; publishing the log tail instead.'
              foreach ($line in @(Get-Content -LiteralPath $logFile | Select-Object -Last 30)) { Write-Problem $line }
          }
          Write-Problem ("msbuild: " + ((& msbuild -version -nologo) -join '; '))
          Write-Problem ("dotnet sdks: " + ((& dotnet --list-sdks) -join '; '))
          throw "MSBuild failed with exit code $code"

      - name: Verify build output (.NET Framework 4.x, x64, post-build copy)
        env:
          OUTDIR: ${{ matrix.outdir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:GITHUB_WORKSPACE ("plugin/$($env:OUTDIR)/FrostyMcpPlugin.dll")
          if (-not (Test-Path $dll)) { throw "Build output missing: $dll" }

          $asm = [System.Reflection.AssemblyName]::GetAssemblyName($dll)
          $size = (Get-Item $dll).Length
          Write-Host "Artifact            : $dll ($size bytes)"
          Write-Host "ImageRuntimeVersion : $($asm.ImageRuntimeVersion)"
          Write-Host "ProcessorArchitecture: $($asm.ProcessorArchitecture)"

          # CLR header must be .NET Framework 4.x: that is what Windows 10 21H2
          # (and Frosty Editor, itself net48) can load. A .NET 5+/Core assembly
          # would build fine here but fail in Frosty on the target machine.
          if ($asm.ImageRuntimeVersion -ne 'v4.0.30319') {
              throw "Expected a .NET Framework v4.0.30319 (net48) assembly but got '$($asm.ImageRuntimeVersion)' - it would not load in Frosty Editor on Windows 10 21H2."
          }
          switch ($asm.ProcessorArchitecture) {
              'Amd64' { Write-Host 'x64 assembly: OK' }
              'MSIL' {
                  Write-Warning 'Assembly is AnyCPU (MSIL); Frosty Editor is x64 so this still loads, but -p:Platform=x64 did not reach the compiler.'
              }
              default { throw "Unexpected ProcessorArchitecture '$($asm.ProcessorArchitecture)' for an x64 Frosty plugin." }
          }

          # The csproj PostBuild target copies the plugin into the editor's
          # Plugins folder: FrostyEditor\<OutDir>Plugins\. Verify it really happened.
          $copy = Join-Path $env:GITHUB_WORKSPACE ("FrostyToolsuite/FrostyEditor/$($env:OUTDIR)/Plugins/FrostyMcpPlugin.dll")
          if (-not (Test-Path $copy)) { throw "Post-build plugin copy missing: $copy" }
          Write-Host "Post-build copy     : $copy"

          @(
              'Build verified for Windows 10 21H2+ (net48, x64)'
              ''
              '| item | value |'
              '| --- | --- |'
              "| DLL | ``plugin/$($env:OUTDIR)/FrostyMcpPlugin.dll`` ($size bytes) |"
              "| CLR header | $($asm.ImageRuntimeVersion) |"
              "| Architecture | $($asm.ProcessorArchitecture) |"
              "| Editor plugin copy | ``FrostyToolsuite/FrostyEditor/$($env:OUTDIR)/Plugins/FrostyMcpPlugin.dll`` |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: FrostyMcpPlugin-${{ matrix.slug }}-x64-${{ matrix.os }}
          path: plugin/${{ matrix.outdir }}/FrostyMcpPlugin.*
          if-no-files-found: error
          retention-days: 14

      - name: Upload MSBuild binlog (diagnostics)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild-binlog-${{ matrix.slug }}-${{ matrix.os }}
          path: msbuild-*.binlog
          if-no-files-found: ignore
          retention-days: 7

      # -----------------------------------------------------------------------
      # Release assets (only on v* tags, only from the "Release - Final" cell)
      # -----------------------------------------------------------------------
      - name: Package release bundle
        if: matrix.release && startsWith(github.ref, 'refs/tags/v')
        env:
          OUTDIR: ${{ matrix.outdir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'pkg'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $pluginRoot = Join-Path $env:GITHUB_WORKSPACE 'plugin'
          Copy-Item (Join-Path $pluginRoot "$($env:OUTDIR)/FrostyMcpPlugin.dll") $stage
          Copy-Item (Join-Path $pluginRoot 'MCP_Server/mcp_frosty.py') $stage
          Copy-Item (Join-Path $pluginRoot 'MCP_Server/requirements.txt') $stage
          $zip = "FrostyMcpPlugin-$env:GITHUB_REF_NAME-x64.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          Write-Host "Packaged $zip"
          Get-ChildItem $zip | Format-List Name, Length

      - name: Publish to GitHub Releases
        if: matrix.release && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "FrostyMcpPlugin-$tag-x64.zip"
          & gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
              & gh release create $tag --title $tag --generate-notes --verify-tag
              if ($LASTEXITCODE -ne 0) { throw "gh release create $tag failed" }
          }
          & gh release upload $tag $zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload $tag failed" }
          Write-Host "Released $zip on $tag"

  # -------------------------------------------------------------------------
  # Version strings must agree (README contribution rule)
  # -------------------------------------------------------------------------
  version-consistency:
    name: Version strings agree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare PluginVersion / bridge / MCP server / README versions
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          def read(path):
              return pathlib.Path(path).read_text(encoding="utf-8", errors="replace")

          def norm(value):
              value = value.strip()
              # [assembly: PluginVersion] is a 4-part version: 1.2.3.0 == 1.2.3
              if re.fullmatch(r"\d+\.\d+\.\d+\.0", value):
                  value = value[:-2]
              return value

          checks = {
              "Properties/AssemblyInfo.cs [assembly: PluginVersion]":
                  r'PluginVersion\("([^"]+)"\)',
              "Bridge/McpBridgeServer.cs McpBridgeServer.Version":
                  r'const\s+string\s+Version\s*=\s*"([^"]+)"',
              "MCP_Server/mcp_frosty.py FROSTY_MCP_VERSION default":
                  r'FROSTY_MCP_VERSION",\s*"([^"]+)"',
              "README.md 'Plugin version'":
                  r'Plugin version:\s*\*\*([^*]+)\*\*',
          }

          found = {}
          for label, pattern in checks.items():
              path = label.split(" ", 1)[0]
              match = re.search(pattern, read(path))
              if not match:
                  print(f"::error::could not find a version string in {path} ({label})")
                  sys.exit(1)
              found[label] = norm(match.group(1))

          width = max(len(k) for k in found)
          for label, value in found.items():
              print(f"{value:<10} {label}")
          if len(set(found.values())) != 1:
              print("::error::Version strings disagree - bump PluginVersion, McpBridgeServer.Version, FROSTY_MCP_VERSION and README.md together.")
              sys.exit(1)
          print(f"OK: all {len(found)} version strings agree")
          PY

  # -------------------------------------------------------------------------
  # Python MCP server side of the bridge
  # -------------------------------------------------------------------------
  mcp-server:
    name: MCP server (Python) sanity
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r MCP_Server/requirements.txt

      - name: Dependency pin still matches the bridge (mcp 1.x + pywin32)
        run: |
          python -c "import importlib.metadata as md; v = md.version('mcp'); print('mcp', v); raise SystemExit(0 if v.split('.')[0] == '1' else 1)"
          python -c "import importlib.metadata as md; print('pywin32', md.version('pywin32'))"

      - name: Byte-compile and import the MCP server
        run: |
          python -m py_compile MCP_Server/mcp_frosty.py
          python -c "import sys; sys.path.insert(0, 'MCP_Server'); import mcp_frosty; print('mcp_frosty import: OK')"
          python -c "import asyncio, sys; sys.path.insert(0, 'MCP_Server'); import mcp_frosty; tools = asyncio.run(mcp_frosty.mcp.list_tools()); print(f'{len(tools)} MCP tools registered')"